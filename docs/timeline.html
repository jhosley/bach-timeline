 color:#8f96ab;border:1px solid #2a2f45;border-radius:20px;padding:5px 14px}

 background:linear-gradient(#e8c874 0 62%, #66607a 62% 74%, #aecbe8 74% 82%, #7fd4c1 82% 100%);opacity:.35}
.era-head{position:relative;text-align:center;margin:78px 0 44px}
.era-head:first-child{margin-top:8px}
.era-head .n{font-family:Georgia,serif;font-size:23px;letter-spacing:.18em;text-transform:uppercase;color:#e9e2cf}

 background:var(--c);transform:translateX(-50%);box-shadow:0 0 14px 2px var(--c)}
.ev{position:relative;width:calc(50% - 34px);margin-bottom:44px;background:#0c0f1e;border:1px solid #1c2136;
 border-radius:8px;overflow:hidden;transition:border-color .2s, transform .2s;display:block;text-decoration:none;color:inherit}
.ev:hover{border-color:rgba(232,200,116,.5);transform:translateY(-2px)}
.ev.L{margin-right:auto}.ev.R{margin-left:auto}
.ev::after{content:'';position:absolute;top:26px;width:34px;height:1px;background:var(--c);opacity:.5}
.ev.L::after{right:-34px}.ev.R::after{left:-34px}
.ev .knot{content:'';position:absolute;top:22px;width:9px;height:9px;border-radius:50%;background:var(--c);
 box-shadow:0 0 10px 1px var(--c)}
.ev.L .knot{right:-38px}.ev.R .knot{left:-38px}
.ev img{width:100%;height:150px;object-fit:cover;display:block;opacity:.92}

.ev .d{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--c);margin-bottom:7px}

.ev .s{font-size:13px;line-height:1.55;color:#9aa2b8}
.ev .more{display:inline-block;margin-top:10px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#e8c874;opacity:.85}
footer{max-width:780px;margin:0 auto;padding:0 22px 60px;text-align:center;font-size:11px;letter-spacing:.14em;color:#5d6478;text-transform:uppercase}
@media(max-width:680px){

 .ev::after{left:-30px !important;right:auto;width:30px}
 .ev .knot{left:-34px !important;right:auto}
 .era-head{text-align:left;padding-left:44px}

 .views{top:42px}
}

<script>
const EVENTS = [{"y": 1685, "yf": 1685.222, "m": "21 March 1685", "t": "Birth of Johann Sebastian Bach", "s": "Johann Sebastian Bach is born 21 March 1685 (old style), eighth and youngest child of Eisenach's town musician, and baptized two days later in the church where Luther once preached.", "d": "1685-03-21", "era": "Eisenach: born into the guild", "flag": "Documented", "c": "#e8c874", "eid": "eisenach", "img": "assets/images/thumbs/wartburg.jpg", "href": "events/eisenach/birth-1685.html"}, {"y": 1685, "yf": 1685.5, "m": "1685", "t": "World track: the class of 1685", "s": "George Frideric Handel is born a month before Bach, eighty miles away; Domenico Scarlatti the same year in Naples. Three careers from one birth year map the era's entire musical world.", "d": "1685", "era": "Eisenach: born into the guild", "flag": "Documented", "c": "#e8c874", "eid": "eisenach", "img": "assets/images/thumbs/handel.jpg", "href": "events/eisenach/handel-scarlatti-1685.html"}, {"y": 1685, "yf": 1685.5, "m": "1685", "t": "The clan: six generations of musical Bachs", "s": "Sebastian is born into the largest musical dynasty in European history — a Thuringian network of town musicians, organists, and cantors so dense that \"Bach\" locally meant \"musician.\"", "d": "1685", "era": "Eisenach: born into the guild", "flag": "Documented", "c": "#e8c874", "eid": "eisenach", "img": "assets/images/thumbs/johann-ambrosius.jpg", "href": "events/eisenach/the-bach-clan.html"}, {"y": 1693, "yf": 1693.5, "m": "c. 1693", "t": "Luther's school, Luther's chorales", "s": "Bach attends the Eisenach Latin school Luther once attended, singing the chorale repertoire that will be the DNA of his life's work — under the castle where Luther translated the Bible.", "d": "1693", "era": "Eisenach: born into the guild", "flag": "Documented", "c": "#e8c874", "eid": "eisenach", "img": "assets/images/thumbs/luther.jpg", "href": "events/eisenach/luthers-town.html"}, {"y": 1694, "yf": 1694.375, "m": "May 1694", "t": "Orphaned: the deaths of Elisabeth and Ambrosius", "s": "Bach's mother dies in May 1694; his father remarries in November and is dead by February 1695. At nine, Sebastian has lost both parents; the household dissolves.", "d": "1694-05-01", "era": "Eisenach: born into the guild", "flag": "Documented", "c": "#e8c874", "eid": "eisenach", "img": "assets/images/thumbs/johann-ambrosius.jpg", "href": "events/eisenach/death-of-parents-1694-95.html"}, {"y": 1695, "yf": 1695.208, "m": "March 1695", "t": "Taken in by his brother — the Pachelbel lineage begins", "s": "The orphaned ten-year-old moves in with his eldest brother Johann Christoph, organist at Ohrdruf and former Pachelbel pupil — who becomes his first keyboard teacher.", "d": "1695-03-01", "era": "Ohrdruf: the brother's apprentice", "flag": "Documented", "c": "#e8c874", "eid": "ohrdruf", "img": "assets/images/thumbs/ohrdruf.jpg", "href": "events/ohrdruf/ohrdruf-brother-1695.html"}, {"y": 1697, "yf": 1697.5, "m": "c. 1697", "t": "Top of the class: the Lyceum record", "s": "The school registers show Bach consistently near the top of his class while two to three years younger than his classmates — the only hard evidence of his general education.", "d": "1697", "era": "Ohrdruf: the brother's apprentice", "flag": "Documented", "c": "#e8c874", "eid": "ohrdruf", "img": "assets/images/thumbs/ohrdruf.jpg", "href": "events/ohrdruf/lyceum-scholar.html"}, {"y": 1698, "yf": 1698.5, "m": "c. 1698", "t": "The moonlight manuscript", "s": "The most famous story of Bach's childhood: six months of secretly copying his brother's forbidden keyboard manuscript by moonlight — only to have the copy confiscated. From the Obituary; unverifiable; irresistible.", "d": "1698", "era": "Ohrdruf: the brother's apprentice", "flag": "Tradition", "c": "#e8c874", "eid": "ohrdruf", "img": "assets/images/thumbs/wtc-title.jpg", "href": "events/ohrdruf/moonlight-manuscript.html"}, {"y": 1700, "yf": 1700.5, "m": "1700", "t": "The earliest Bach manuscripts: copying Reincken 'at Master Böhm's'", "s": "Organ tablatures identified in 2006 show the 15-year-old Bach copying the north-German masters — one inscribed as written at Georg Böhm's — the earliest surviving documents in Bach's hand.", "d": "1700", "era": "Lüneburg: the northern education", "flag": "Documented", "c": "#e8c874", "eid": "lueneburg", "img": "assets/images/thumbs/wtc-title.jpg", "href": "events/lueneburg/boehm-tablatures.html"}, {"y": 1700, "yf": 1700.292, "m": "April 1700", "t": "Singing for his bread: the Mettenchor scholarship", "s": "Bach and Erdmann enter the Michaelisschule's matins choir — free schooling and board in exchange for singing. Bach's voice breaks within months; his violin and keyboard keep him on.", "d": "1700-04-03", "era": "Lüneburg: the northern education", "flag": "Documented", "c": "#e8c874", "eid": "lueneburg", "img": "assets/images/thumbs/michaeliskirche.jpg", "href": "events/lueneburg/luneburg-scholarship-1700.html"}, {"y": 1700, "yf": 1700.208, "m": "March 1700", "t": "'For lack of free board': the walk north", "s": "At fifteen, his free schooling exhausted, Bach leaves Ohrdruf with his friend Georg Erdmann for a choral scholarship two hundred miles north in Lüneburg — on foot.", "d": "1700-03-15", "era": "Ohrdruf: the brother's apprentice", "flag": "Documented", "c": "#e8c874", "eid": "ohrdruf", "img": "assets/images/thumbs/michaeliskirche.jpg", "href": "events/ohrdruf/departure-luneburg-1700.html"}, {"y": 1701, "yf": 1701.5, "m": "c. 1701", "t": "The two poles: Reincken's Hamburg, France at Celle", "s": "From Lüneburg, Bach walks to Hamburg to hear Reincken's organ playing and encounters the French orchestral style cultivated at the Celle court — the northern and western poles of his self-built education.", "d": "1701", "era": "Lüneburg: the northern education", "flag": "Tradition", "c": "#e8c874", "eid": "lueneburg", "img": "assets/images/thumbs/celle.jpg", "href": "events/lueneburg/hamburg-celle-trips.html"}, {"y": 1701, "yf": 1701.5, "m": "c. 1701", "t": "A thousand works: the St. Michael's music library", "s": "The Michaelisschule's choir library — over a thousand works by 175 composers — gives Bach his first panoramic view of the German choral tradition he will one day crown.", "d": "1701", "era": "Lüneburg: the northern education", "flag": "Documented", "c": "#e8c874", "eid": "lueneburg", "img": "assets/images/thumbs/michaeliskirche.jpg", "href": "events/lueneburg/michaelis-library.html"}, {"y": 1703, "yf": 1703.606, "m": "9 August 1703", "t": "Organist at eighteen — on his own terms", "s": "After his examination of the Neue Kirche's new Wender organ turns into a de facto audition, Arnstadt appoints the 18-year-old organist at a salary exceeding his senior colleagues'.", "d": "1703-08-09", "era": "Arnstadt: the difficult young genius", "flag": "Documented", "c": "#e8c874", "eid": "arnstadt", "img": "assets/images/thumbs/bachkirche.jpg", "href": "events/arnstadt/arnstadt-appointment-1703.html"}, {"y": 1703, "yf": 1703.042, "m": "January 1703", "t": "First job: court violinist (and lackey) at Weimar", "s": "Fresh from Lüneburg, the 17-year-old takes his first paid post — violinist in the private Capelle of Duke Johann Ernst III at Weimar, on the books as a lackey — lasting about six months.", "d": "1703-01-15", "era": "Arnstadt: the difficult young genius", "flag": "Documented", "c": "#e8c874", "eid": "arnstadt", "img": "assets/images/thumbs/himmelsburg.jpg", "href": "events/arnstadt/weimar-interlude-1703.html"}, {"y": 1705, "yf": 1705.593, "m": "4 August 1705", "t": "The 'Zippel Fagottist' affair: swords in the market square", "s": "Insulted as a \"dirty dog\" by a student bassoonist he had called a \"greenhorn bassoonist,\" Bach draws his sword in the market square. The consistory investigation survives verbatim.", "d": "1705-08-04", "era": "Arnstadt: the difficult young genius", "flag": "Documented", "c": "#e8c874", "eid": "arnstadt", "img": "assets/images/thumbs/bach-statue-arnstadt.jpg", "href": "events/arnstadt/geyersbach-1705.html"}, {"y": 1705, "yf": 1705.792, "m": "October 1705", "t": "The 250-mile walk: Buxtehude and the four-month leave", "s": "Granted four weeks' leave, Bach walks ~250 miles to Lübeck to hear Buxtehude and the Abendmusik concerts — and stays four months, \"in order to comprehend one thing and another about his art.\"", "d": "1705-10-15", "era": "Arnstadt: the difficult young genius", "flag": "Documented", "c": "#e8c874", "eid": "arnstadt", "img": "assets/images/thumbs/marienkirche.jpg", "href": "events/arnstadt/lubeck-buxtehude-1705.html"}, {"y": 1706, "yf": 1706.138, "m": "21 February 1706", "t": "'Strange variations... foreign tones': the consistory hearings", "s": "Called to account for the four-month absence, Bach is also charged with confusing the congregation with his chorale harmonizations — and, months later, with hosting an \"unfamiliar maiden\" in the choir loft.", "d": "1706-02-21", "era": "Arnstadt: the difficult young genius", "flag": "Documented", "c": "#e8c874", "eid": "arnstadt", "img": "assets/images/thumbs/bach-statue-arnstadt.jpg", "href": "events/arnstadt/consistory-rebukes-1706.html"}, {"y": 1707, "yf": 1707.794, "m": "17 October 1707", "t": "Marriage to Maria Barbara at Dornheim", "s": "Weeks after a timely inheritance, Bach marries his cousin Maria Barbara Bach in the village church at Dornheim — founding the first Bach household.", "d": "1707-10-17", "era": "Mühlhausen: the mission statement", "flag": "Documented", "c": "#e8c874", "eid": "muehlhausen", "img": "assets/images/thumbs/dornheim.jpg", "href": "events/muehlhausen/marriage-maria-barbara-1707.html"}, {"y": 1707, "yf": 1707.456, "m": "15 June 1707", "t": "Organist of Divi Blasii — negotiating like a Bach", "s": "After an Easter audition, the free imperial city hires the 22-year-old away from Arnstadt — at terms he dictates: full Arnstadt salary plus grain, wood, and fish allowances, and a wagon for the move.", "d": "1707-06-15", "era": "Mühlhausen: the mission statement", "flag": "Documented", "c": "#e8c874", "eid": "muehlhausen", "img": "assets/images/thumbs/divi-blasii.jpg", "href": "events/muehlhausen/muehlhausen-appointment-1707.html"}, {"y": 1708, "yf": 1708.093, "m": "4 February 1708", "t": "'Gott ist mein König': the only cantata Bach ever saw in print", "s": "For the town council's inauguration, Bach mounts the festive cantata Gott ist mein König (BWV 71) — brass choirs, spatial effects, civic splendor — and the proud council pays to print it: unique in his lifetime.", "d": "1708-02-04", "era": "Mühlhausen: the mission statement", "flag": "Documented", "c": "#e8c874", "eid": "muehlhausen", "img": "assets/images/thumbs/bwv71-print.jpg", "href": "events/muehlhausen/bwv71-printed-1708.html"}, {"y": 1708, "yf": 1708.483, "m": "25 June 1708", "t": "The Endzweck letter: 'a well-regulated church music to the glory of God'", "s": "Offered the Weimar court organist post at nearly double the pay, Bach resigns from Mühlhausen with the letter that states his life's goal — and diagnoses why this town couldn't host it.", "d": "1708-06-25", "era": "Mühlhausen: the mission statement", "flag": "Documented", "c": "#e8c874", "eid": "muehlhausen", "img": "assets/images/thumbs/divi-blasii.jpg", "href": "events/muehlhausen/muehlhausen-resignation-1708.html"}, {"y": 1708, "yf": 1708.542, "m": "July 1708", "t": "Court organist to Duke Wilhelm Ernst", "s": "Bach returns to Weimar — the court where he was once a lackey — as court organist and chamber musician at roughly double his Mühlhausen income.", "d": "1708-07-01", "era": "Weimar: the organ decade and the Italian conversion", "flag": "Documented", "c": "#e8c874", "eid": "weimar", "img": "assets/images/thumbs/himmelsburg.jpg", "href": "events/weimar/weimar-court-organist-1708.html"}, {"y": 1708, "yf": 1708.993, "m": "29 December 1708", "t": "The Weimar nursery: Friedemann, Emanuel — and Telemann at the font", "s": "Six of Maria Barbara's seven children are born in Weimar, including the two great composer-sons — Wilhelm Friedemann (1710) and Carl Philipp Emanuel (1714), whose godfather was Telemann.", "d": "1708-12-29", "era": "Weimar: the organ decade and the Italian conversion", "flag": "Documented", "c": "#e8c874", "eid": "weimar", "img": "assets/images/thumbs/wilhelm-friedemann.jpg", "href": "events/weimar/weimar-family-births.html"}, {"y": 1709, "yf": 1709.5, "m": "c. 1709", "t": "Working conditions: music from the ceiling of Heaven's Castle", "s": "Bach's Weimar workplace: the Himmelsburg chapel, whose musicians performed from a gallery set in the ceiling — plus an organ rebuilt to his own specification.", "d": "1709", "era": "Weimar: the organ decade and the Italian conversion", "flag": "Documented", "c": "#e8c874", "eid": "weimar", "img": "assets/images/thumbs/himmelsburg.jpg", "href": "events/weimar/himmelsburg.html"}, {"y": 1712, "yf": 1712.5, "m": "c. 1712", "t": "Two dukes, one Capelle: the feud that framed everything", "s": "Weimar was co-ruled by a pious uncle and a resentful nephew from adjacent palaces; the musicians served both and were punished for it — the political trap that eventually closed on Bach.", "d": "1712", "era": "Weimar: the organ decade and the Italian conversion", "flag": "Documented", "c": "#e8c874", "eid": "weimar", "img": "assets/images/thumbs/wilhelm-ernst.jpg", "href": "events/weimar/two-dukes.html"}, {"y": 1713, "yf": 1713.958, "m": "December 1713", "t": "The Halle gambit: an offer used as leverage", "s": "Bach auditions for the prestigious Halle organist post, receives the offer, extracts a raise from Weimar — and declines Halle, who accuse him of negotiating in bad faith.", "d": "1713-12-01", "era": "Weimar: the organ decade and the Italian conversion", "flag": "Documented", "c": "#e8c874", "eid": "weimar", "img": "assets/images/thumbs/halle.jpg", "href": "events/weimar/halle-gambit-1713.html"}, {"y": 1713, "yf": 1713.5, "m": "c. 1713", "t": "The Italian conversion: Vivaldi arrives in a crate from Amsterdam", "s": "The young Prince Johann Ernst returns from the Netherlands with the newest Italian concerto prints — above all Vivaldi's L'estro armonico — and Bach absorbs them by transcribing some twenty concertos for keyboard. His sense of form is permanently rewired.", "d": "1713", "era": "Weimar: the organ decade and the Italian conversion", "flag": "Documented", "c": "#e8c874", "eid": "weimar", "img": "assets/images/thumbs/vivaldi.jpg", "href": "events/weimar/vivaldi-transcriptions.html"}, {"y": 1714, "yf": 1714.171, "m": "2 March 1714", "t": "Konzertmeister — and a cantata a month", "s": "Promoted to Konzertmeister (a post created for him), Bach acquires his first regular composing duty: one cantata per month for the Himmelsburg — where the Italian aria and recitative enter his church music for good.", "d": "1714-03-02", "era": "Weimar: the organ decade and the Italian conversion", "flag": "Documented", "c": "#e8c874", "eid": "weimar", "img": "assets/images/thumbs/himmelsburg.jpg", "href": "events/weimar/konzertmeister-1714.html"}, {"y": 1714, "yf": 1714.5, "m": "c. 1714", "t": "The Orgelbüchlein: 164 planned, 46 written, all essential", "s": "Bach rules a book for 164 chorale preludes spanning the church year — and completes 46, each a perfect miniature. Its title page states his creed: for the glory of God and the instruction of the neighbor.", "d": "1714", "era": "Weimar: the organ decade and the Italian conversion", "flag": "Documented", "c": "#e8c874", "eid": "weimar", "img": "assets/images/thumbs/silbermann-organ.jpg", "href": "events/weimar/orgelbuchlein.html"}, {"y": 1716, "yf": 1716.958, "m": "December 1716", "t": "Passed over: the Kapellmeister job goes to the mediocre son", "s": "Old Kapellmeister Drese dies; Bach writes a burst of Advent cantatas as an audible application — and the duke gives the post to Drese's undistinguished son. Bach's cantata production stops almost completely.", "d": "1716-12-01", "era": "Weimar: the organ decade and the Italian conversion", "flag": "Documented", "c": "#e8c874", "eid": "weimar", "img": "assets/images/thumbs/wilhelm-ernst.jpg", "href": "events/weimar/passed-over-1716.html"}, {"y": 1717, "yf": 1717.958, "m": "December 1717", "t": "Arrival in Cöthen — and a detour to test Leipzig's new organ", "s": "Days out of jail, Bach takes up his Kapellmeister duties at Cöthen — pausing in mid-December to examine the big new organ at Leipzig's university church, his first professional footprint in the city that would later define his life.", "d": "1717-12-10", "era": "Cöthen: the instrumental golden age", "flag": "Documented", "c": "#e8c874", "eid": "cothen", "img": "assets/images/thumbs/schloss-koethen.jpg", "href": "events/cothen/arrival-cothen-1717.html"}, {"y": 1717, "yf": 1717.625, "m": "August 1717", "t": "Appointed Kapellmeister to Prince Leopold", "s": "While still employed (and increasingly unhappy) at Weimar, Bach accepts the post of Kapellmeister to the young Prince Leopold of Anhalt-Cöthen — the highest title of his career.", "d": "1717-08-05", "era": "Cöthen: the instrumental golden age", "flag": "Documented", "c": "#e8c874", "eid": "cothen", "img": "assets/images/thumbs/leopold.jpg", "href": "events/cothen/cothen-appointment-1717.html"}, {"y": 1717, "yf": 1717.848, "m": "6 November 1717", "t": "A month in the Duke's jail", "s": "For demanding his release from Weimar too stubbornly, Bach is imprisoned by Duke Wilhelm Ernst for nearly four weeks, then dismissed in disgrace — and leaves immediately for Cöthen.", "d": "1717-11-06", "era": "Cöthen: the instrumental golden age", "flag": "Documented", "c": "#e8c874", "eid": "cothen", "img": "assets/images/thumbs/wilhelm-ernst.jpg", "href": "events/cothen/weimar-jail-1717.html"}, {"y": 1717, "yf": 1717.708, "m": "September 1717", "t": "The duel that wasn't: Marchand flees Dresden", "s": "Challenged to a keyboard contest at the Dresden court against the celebrated French virtuoso Louis Marchand, Bach shows up — and Marchand, having heard him play, leaves town by dawn coach.", "d": "1717-09-15", "era": "Weimar: the organ decade and the Italian conversion", "flag": "Tradition", "c": "#e8c874", "eid": "weimar", "img": "assets/images/thumbs/marchand.jpg", "href": "events/weimar/marchand-1717.html"}, {"y": 1718, "yf": 1718.875, "m": "November 1718", "t": "A son named for the prince — and lost within a year", "s": "Maria Barbara bears a seventh child, Leopold Augustus, with Prince Leopold himself standing godfather; the boy dies in September 1719 — one of the ten Bach children who did not survive.", "d": "1718-11-15", "era": "Cöthen: the instrumental golden age", "flag": "Documented", "c": "#e8c874", "eid": "cothen", "img": "assets/images/thumbs/leopold.jpg", "href": "events/cothen/birth-leopold-augustus-1718.html"}, {"y": 1718, "yf": 1718.5, "m": "1718", "t": "Working conditions: the Capelle, the salary, the freedom", "s": "A standing snapshot of Bach's best job: a virtuoso 17-player ensemble inherited from the dissolved Prussian court orchestra, a prince who played alongside them, top-tier pay, and no church-music obligations at all.", "d": "1718", "era": "Cöthen: the instrumental golden age", "flag": "Documented", "c": "#e8c874", "eid": "cothen", "img": "assets/images/thumbs/schloss-koethen.jpg", "href": "events/cothen/the-cothen-capelle.html"}, {"y": 1719, "yf": 1719.208, "m": "March 1719", "t": "To Berlin for a harpsichord — and a fateful introduction", "s": "Bach travels to Berlin to collect a large two-manual harpsichord by Michael Mietke for the Cöthen court — and plays before the Margrave Christian Ludwig of Brandenburg, who asks him to send some of his compositions.", "d": "1719-03-01", "era": "Cöthen: the instrumental golden age", "flag": "Documented", "c": "#e8c874", "eid": "cothen", "img": "assets/images/thumbs/mietke.jpg", "href": "events/cothen/berlin-harpsichord-1719.html"}, {"y": 1720, "yf": 1720.058, "m": "22 January 1720", "t": "The Clavierbüchlein for Wilhelm Friedemann — Bach the father-teacher", "s": "Bach begins a keyboard notebook for his eldest son, aged nine — the workshop in which the Inventions, Sinfonias, and early Well-Tempered Clavier preludes take shape.", "d": "1720-01-22", "era": "Cöthen: the instrumental golden age", "flag": "Documented", "c": "#e8c874", "eid": "cothen", "img": "assets/images/thumbs/wilhelm-friedemann.jpg", "href": "events/cothen/clavierbuchlein-wf-1720.html"}, {"y": 1720, "yf": 1720.875, "m": "November 1720", "t": "Hamburg: Reincken's blessing, and the job that went to the highest bidder", "s": "Bach plays in Hamburg before the ancient Johann Adam Reincken, improvising on a chorale for half an hour and earning the old master's benediction — then withdraws from the vacant Jacobikirche organist post, which goes to a candidate offering 4,000 marks for the privilege.", "d": "1720-11-01", "era": "Cöthen: the instrumental golden age", "flag": "Documented", "c": "#e8c874", "eid": "cothen", "img": "assets/images/thumbs/musical-company.jpg", "href": "events/cothen/hamburg-reincken-1720.html"}, {"y": 1720, "yf": 1720.542, "m": "July 1720", "t": "The death of Maria Barbara", "s": "Returning from two months at Carlsbad with the prince, Bach learns that his wife has died suddenly and was buried in his absence. He is 35, with four living children aged 5 to 11.", "d": "1720-07-07", "era": "Cöthen: the instrumental golden age", "flag": "Documented", "c": "#e8c874", "eid": "cothen", "img": "assets/images/thumbs/chaconne-autograph.png", "href": "events/cothen/maria-barbara-death-1720.html"}, {"y": 1721, "yf": 1721.23, "m": "24 March 1721", "t": "Six concertos posted to Brandenburg", "s": "Bach signs the French dedication of \"Six Concerts avec plusieurs instruments\" to Margrave Christian Ludwig of Brandenburg — a beautifully copied job application that was likely never performed by its recipient.", "d": "1721-03-24", "era": "Cöthen: the instrumental golden age", "flag": "Documented", "c": "#e8c874", "eid": "cothen", "img": "assets/images/thumbs/brandenburg-title.png", "href": "events/cothen/brandenburg-dedication-1721.html"}, {"y": 1721, "yf": 1721.945, "m": "11 December 1721", "t": "The prince marries an 'amusa' — the golden age starts to dim", "s": "Eight days after Bach's wedding, Prince Leopold marries his cousin Friederica Henrietta — in Bach's later words an \"amusa,\" indifferent to music — and the court's musical priorities begin to fade.", "d": "1721-12-11", "era": "Cöthen: the instrumental golden age", "flag": "Documented", "c": "#e8c874", "eid": "cothen", "img": "assets/images/thumbs/leopold.jpg", "href": "events/cothen/leopold-marriage-1721.html"}, {"y": 1721, "yf": 1721.923, "m": "3 December 1721", "t": "Marriage to Anna Magdalena Wilcke", "s": "Seventeen months after Maria Barbara's death, Bach marries the 20-year-old court soprano Anna Magdalena Wilcke — a professional partnership as much as a marriage.", "d": "1721-12-03", "era": "Cöthen: the instrumental golden age", "flag": "Documented", "c": "#e8c874", "eid": "cothen", "img": "assets/images/thumbs/amb-notebook.jpg", "href": "events/cothen/marriage-anna-magdalena-1721.html"}, {"y": 1722, "yf": 1722.5, "m": "1722", "t": "1722: the Well-Tempered Clavier fair copy and Anna Magdalena's first notebook", "s": "In one year Bach completes the fair copy of WTC Book I — 24 preludes and fugues through all the keys — and begins a keyboard notebook for his new wife containing the first French Suites.", "d": "1722", "era": "Cöthen: the instrumental golden age", "flag": "Documented", "c": "#e8c874", "eid": "cothen", "img": "assets/images/thumbs/wtc-title.jpg", "href": "events/cothen/wtc-and-notebooks-1722.html"}, {"y": 1723, "yf": 1723.391, "m": "22 May 1723", "t": "Farewell to Cöthen", "s": "Released graciously by Leopold — and keeping his Kapellmeister title — Bach moves his family and household to Leipzig on 22 May 1723. He will return to Cöthen once more, in 1729, to bury his prince.", "d": "1723-05-22", "era": "Cöthen: the instrumental golden age", "flag": "Documented", "c": "#e8c874", "eid": "cothen", "img": "assets/images/thumbs/thomaskirche-1723.jpg", "href": "events/cothen/farewell-cothen-1723.html"}, {"y": 1723, "yf": 1723.101, "m": "7 February 1723", "t": "The Leipzig audition — third choice for the job of the century", "s": "Bach auditions for the Leipzig cantorate with two cantatas on Quinquagesima Sunday. The council preferred Telemann, then Graupner; only after both fell through did it settle, in one councilman's words, for the \"mediocre\" option.", "d": "1723-02-07", "era": "Cöthen: the instrumental golden age", "flag": "Documented", "c": "#e8c874", "eid": "cothen", "img": "assets/images/thumbs/thomaskirche-1723.jpg", "href": "events/cothen/leipzig-audition-1723.html"}, {"y": 1723, "yf": 1723.375, "m": "May 1723", "t": "The cantata machine: a masterwork a week", "s": "From his first Sunday (30 May 1723, BWV 75), Bach produces a new cantata nearly every week for two years — including the 1724–25 chorale cantata cycle, the most astonishing sustained feat in Western composition.", "d": "1723-05-30", "era": "Leipzig I: the cantata machine", "flag": "Documented", "c": "#e8c874", "eid": "leipzig-1", "img": "assets/images/thumbs/thomaskirche-1723.jpg", "href": "events/leipzig-1/cantata-machine.html"}, {"y": 1723, "yf": 1723.983, "m": "25 December 1723", "t": "First Christmas: the Magnificat", "s": "For his first Leipzig Christmas, Bach mounts the Magnificat — his most concentrated large choral work, five-part choir and festival orchestra, first heard with Christmas interpolations tucked between its movements.", "d": "1723-12-25", "era": "Leipzig I: the cantata machine", "flag": "Documented", "c": "#e8c874", "eid": "leipzig-1", "img": "assets/images/thumbs/magnificat-autograph.jpg", "href": "events/leipzig-1/magnificat-1723.html"}, {"y": 1723, "yf": 1723.418, "m": "1 June 1723", "t": "The job: cantor, teacher, director, tenant, servant of the council", "s": "Installed 1 June 1723, Bach takes on the strangest job description of his career: fourth master of a boarding school, music director of four churches, and civic official — paid mostly in wedding and funeral fees.", "d": "1723-06-01", "era": "Leipzig I: the cantata machine", "flag": "Documented", "c": "#e8c874", "eid": "leipzig-1", "img": "assets/images/thumbs/thomaskirche-1723.jpg", "href": "events/leipzig-1/thomaskantor-job-1723.html"}, {"y": 1724, "yf": 1724.267, "m": "7 April 1724", "t": "Good Friday 1724: the St. John Passion", "s": "Ten months into the job, Bach mounts his first Leipzig Passion — dramatic, turbulent, built on John's Gospel — beginning a Good Friday tradition he will revise and re-fight for the rest of his life.", "d": "1724-04-07", "era": "Leipzig I: the cantata machine", "flag": "Documented", "c": "#e8c874", "eid": "leipzig-1", "img": "assets/images/thumbs/john-passion-autograph.jpg", "href": "events/leipzig-1/john-passion-1724.html"}, {"y": 1725, "yf": 1725.5, "m": "c. 1725", "t": "The household in the school: family as workshop, and its costs", "s": "The Bachs' Thomasschule apartment holds a family, a music library, a copying shop, and a steady procession of births and burials — the domestic engine and price of the Leipzig output.", "d": "1725", "era": "Leipzig I: the cantata machine", "flag": "Documented", "c": "#e8c874", "eid": "leipzig-1", "img": "assets/images/thumbs/amb-notebook.jpg", "href": "events/leipzig-1/cantors-household.html"}, {"y": 1727, "yf": 1727.278, "m": "11 April 1727", "t": "Good Friday 1727: the St. Matthew Passion", "s": "Double choir, double orchestra, three hours: the St. Matthew Passion — by broad consent the summit of Western sacred music — is first heard at the Thomaskirche, to no recorded contemporary comment whatsoever.", "d": "1727-04-11", "era": "Leipzig I: the cantata machine", "flag": "Documented", "c": "#e8c874", "eid": "leipzig-1", "img": "assets/images/thumbs/matthew-autograph.jpg", "href": "events/leipzig-1/matthew-passion-1727.html"}, {"y": 1729, "yf": 1729.208, "m": "March 1729", "t": "Director of the Collegium Musicum: Bach goes public", "s": "Bach takes over the student concert society Telemann founded — weekly public concerts at Zimmermann's coffee house — and invents the public keyboard concerto in the process.", "d": "1729-03-01", "era": "Leipzig II: coffee-house concertos and paper wars", "flag": "Documented", "c": "#e8c874", "eid": "leipzig-2", "img": "assets/images/thumbs/zimmermann.jpg", "href": "events/leipzig-2/collegium-1729.html"}, {"y": 1730, "yf": 1730.644, "m": "23 August 1730", "t": "'Incorrigible': the council's rebuke and the great memorandum", "s": "The council votes that the cantor \"does nothing\" and is \"incorrigible\"; Bach replies with the Draft for a Well-Appointed Church Music — the most important document on musicians' working conditions of the entire era.", "d": "1730-08-23", "era": "Leipzig II: coffee-house concertos and paper wars", "flag": "Documented", "c": "#e8c874", "eid": "leipzig-2", "img": "assets/images/thumbs/thomaskirche-1723.jpg", "href": "events/leipzig-2/memo-1730.html"}, {"y": 1731, "yf": 1731.5, "m": "1731", "t": "Clavier-Übung: Bach publishes himself", "s": "Across a decade Bach issues his keyboard art in four engraved volumes — Partitas, Italian Concerto and French Overture, the great organ Mass, and the Goldbergs — self-published, largely at his own expense.", "d": "1731", "era": "Leipzig II: coffee-house concertos and paper wars", "flag": "Documented", "c": "#e8c874", "eid": "leipzig-2", "img": "assets/images/thumbs/partitas-print.jpg", "href": "events/leipzig-2/clavier-ubung.html"}, {"y": 1733, "yf": 1733.571, "m": "27 July 1733", "t": "The Dresden gambit: a Missa for a title", "s": "Bach presents a magnificent Kyrie and Gloria — the future B minor Mass's first half — to the new Elector of Saxony with a petition for a court title, and after three years' pursuit is named Royal Polish and Electoral Saxon Court Composer.", "d": "1733-07-27", "era": "Leipzig II: coffee-house concertos and paper wars", "flag": "Documented", "c": "#e8c874", "eid": "leipzig-2", "img": "assets/images/thumbs/frauenkirche.jpg", "href": "events/leipzig-2/dresden-title-1733-36.html"}, {"y": 1734, "yf": 1734.983, "m": "25 December 1734", "t": "Christmas 1734: the Oratorio, and the parody workshop at full power", "s": "Six cantatas spanning Christmas Day to Epiphany — much of the music re-texted from recent secular court cantatas — form the Christmas Oratorio: the definitive exhibit of Bach's parody technique.", "d": "1734-12-25", "era": "Leipzig II: coffee-house concertos and paper wars", "flag": "Documented", "c": "#e8c874", "eid": "leipzig-2", "img": "assets/images/thumbs/zimmermann.jpg", "href": "events/leipzig-2/christmas-oratorio-1734.html"}, {"y": 1736, "yf": 1736.542, "m": "July 1736", "t": "The battle of the prefects: two years of war over a student conductor", "s": "Cantor and rector wage a two-year paper war — escalating to consistory and king — over who appoints the student choir prefects. Beneath the farce: whether music still stood at the school's center.", "d": "1736-07-01", "era": "Leipzig II: coffee-house concertos and paper wars", "flag": "Documented", "c": "#e8c874", "eid": "leipzig-2", "img": "assets/images/thumbs/thomaskirche-1723.jpg", "href": "events/leipzig-2/prefect-dispute-1736.html"}, {"y": 1737, "yf": 1737.37, "m": "14 May 1737", "t": "Scheibe's attack: 'turgid' — the future files its complaint", "s": "A young critic publishes the era's verdict on Bach: astonishing skill, but music \"turgid,\" darkened by \"an excess of art,\" against nature. The pamphlet war that follows defines the aesthetic fault line of the century.", "d": "1737-05-14", "era": "Leipzig II: coffee-house concertos and paper wars", "flag": "Documented", "c": "#e8c874", "eid": "leipzig-2", "img": "assets/images/thumbs/johann-sebastian-bach.jpg", "href": "events/leipzig-2/scheibe-1737.html"}, {"y": 1741, "yf": 1741.792, "m": "October 1741", "t": "The Goldberg Variations published — and the insomnia legend", "s": "Clavier-Übung IV appears: an aria and thirty variations of unprecedented design. The famous story — commissioned to cure Count Keyserlingk's insomnia, played nightly by young Goldberg — is Forkel's, and probably embroidered.", "d": "1741-10-01", "era": "Leipzig III: the summing-up", "flag": "Documented", "c": "#e8c874", "eid": "leipzig-3", "img": "assets/images/thumbs/goldberg-title.png", "href": "events/leipzig-3/goldberg-1741.html"}, {"y": 1742, "yf": 1742.5, "m": "c. 1742", "t": "The Art of Fugue: one theme, all of fugue", "s": "Around 1742 Bach begins his most abstract project: a cycle demonstrating every species of fugue and canon from a single D-minor subject — expanded for publication in his last years and left unfinished at his death.", "d": "1742", "era": "Leipzig III: the summing-up", "flag": "Documented", "c": "#e8c874", "eid": "leipzig-3", "img": "assets/images/thumbs/art-of-fugue-last.jpg", "href": "events/leipzig-3/art-of-fugue-begun.html"}, {"y": 1747, "yf": 1747.458, "m": "June 1747", "t": "Member No. 14: the learned society and the portrait with a canon", "s": "Bach joins Mizler's Society of Musical Sciences — submitting the Canonic Variations and the Haussmann portrait in which he holds a puzzle canon: the only certain image of Bach, showing exactly how he wished to be seen.", "d": "1747-06-01", "era": "Leipzig III: the summing-up", "flag": "Documented", "c": "#e8c874", "eid": "leipzig-3", "img": "assets/images/thumbs/johann-sebastian-bach.jpg", "href": "events/leipzig-3/mizler-1747.html"}, {"y": 1747, "yf": 1747.351, "m": "7 May 1747", "t": "'Old Bach is here': Frederick the Great and the royal theme", "s": "Visiting his son at the Prussian court, Bach is summoned by Frederick the Great, handed a chromatic theme, and improvises fugues on the king's new fortepianos — then goes home and builds the Musical Offering around the challenge.", "d": "1747-05-07", "era": "Leipzig III: the summing-up", "flag": "Documented", "c": "#e8c874", "eid": "leipzig-3", "img": "assets/images/thumbs/frederick-the-great.jpg", "href": "events/leipzig-3/potsdam-1747.html"}, {"y": 1748, "yf": 1748.5, "m": "1748", "t": "The B minor Mass assembled: a life's sacred music in one summa", "s": "In his last working years Bach completes the B minor Mass — extending the 1733 Dresden Missa into a full Latin Mass, largely by transfiguring the greatest movements of his life's work. He never heard it whole.", "d": "1748", "era": "Leipzig III: the summing-up", "flag": "Documented", "c": "#e8c874", "eid": "leipzig-3", "img": "assets/images/thumbs/bmm-autograph.jpg", "href": "events/leipzig-3/b-minor-mass-1749.html"}, {"y": 1750, "yf": 1750.875, "m": "November 1750", "t": "The estate divided: how the manuscripts scattered", "s": "Bach's musical estate is divided among the heirs: Emanuel preserves his share, Friedemann sells his off, and perhaps two-fifths of the life's work is eventually lost.", "d": "1750-11-01", "era": "The Eclipse: 1750–1829", "flag": "Documented", "c": "#8d87a6", "eid": "eclipse", "img": "assets/images/thumbs/bach-signature.png", "href": "events/eclipse/estate-dispersal-1750.html"}, {"y": 1750, "yf": 1750.574, "m": "28 July 1750", "t": "28 July 1750: the death of Johann Sebastian Bach", "s": "Blinded by two operations from the itinerant oculist John Taylor, Bach dies of a stroke on 28 July 1750, aged 65. The estate is divided, the manuscripts scattered, and the council replaces him within days — relieved.", "d": "1750-07-28", "era": "Leipzig III: the summing-up", "flag": "Documented", "c": "#e8c874", "eid": "leipzig-3", "img": "assets/images/thumbs/art-of-fugue-last.jpg", "href": "events/leipzig-3/death-1750.html"}, {"y": 1760, "yf": 1760.5, "m": "c. 1760", "t": "'The great Bach': when the name meant the sons", "s": "For a generation, \"Bach\" means Carl Philipp Emanuel in Berlin and Hamburg, or Johann Christian in London — the father a respected, receding memory called \"old Bach.\"", "d": "1760", "era": "The Eclipse: 1750–1829", "flag": "Documented", "c": "#8d87a6", "eid": "eclipse", "img": "assets/images/thumbs/jc-bach.jpg", "href": "events/eclipse/the-sons-era.html"}, {"y": 1782, "yf": 1782.5, "m": "c. 1782", "t": "Sundays at van Swieten's: Mozart meets the fugues", "s": "", "d": "1782", "era": "The Eclipse: 1750–1829", "flag": "Documented", "c": "#8d87a6", "eid": "eclipse", "img": "assets/images/thumbs/mozart.jpg", "href": "events/eclipse/van-swieten-salon.html"}, {"y": 1783, "yf": 1783.5, "m": "1783", "t": "'Not a brook but a sea': Beethoven raised on the 48", "s": "The twelve-year-old Beethoven's first press notice announces him playing \"the Well-Tempered Clavier of Sebastian Bach\" — the manuscript classic as prodigy fuel, one generation before the revival.", "d": "1783", "era": "The Eclipse: 1750–1829", "flag": "Documented", "c": "#8d87a6", "eid": "eclipse", "img": "assets/images/thumbs/beethoven.jpg", "href": "events/eclipse/beethoven-wtc.html"}, {"y": 1789, "yf": 1789.292, "m": "April 1789", "t": "'Now, there is something one can learn from!': Mozart at the Thomaskirche", "s": "Visiting Leipzig in 1789, Mozart hears the Thomanerchor sing Singet dem Herrn — and demands the parts, spreading them around himself to study on the spot.", "d": "1789-04-22", "era": "The Eclipse: 1750–1829", "flag": "Documented", "c": "#8d87a6", "eid": "eclipse", "img": "assets/images/thumbs/mozart.jpg", "href": "events/eclipse/mozart-motet-1789.html"}, {"y": 1802, "yf": 1802.5, "m": "1802", "t": "Forkel's biography: the legend gets an author", "s": "The first Bach biography appears — built on the sons' testimony, aimed at a national audience: \"this great man was a German. Be proud of him, German fatherland!\"", "d": "1802", "era": "The Eclipse: 1750–1829", "flag": "Documented", "c": "#8d87a6", "eid": "eclipse", "img": "assets/images/thumbs/forkel.jpg", "href": "events/eclipse/forkel-1802.html"}, {"y": 1824, "yf": 1824.5, "m": "c. 1824", "t": "A birthday present: the copyist's score of the Matthew Passion", "s": "Mendelssohn's grandmother commissions a hand copy of the St. Matthew Passion from the Singakademie's treasures — the object around which the 1829 revival forms.", "d": "1824", "era": "The Rediscovery: 1829–1850", "flag": "Documented", "c": "#aecbe8", "eid": "revival", "img": "assets/images/thumbs/felix-mendelssohn.jpg", "href": "events/revival/singakademie-score-1824.html"}, {"y": 1829, "yf": 1829.195, "m": "11 March 1829", "t": "11 March 1829: the St. Matthew Passion returns", "s": "A 20-year-old Mendelssohn conducts the Berlin Singakademie in the first St. Matthew Passion since Bach's death. The hall overflows, the performance repeats twice, and Bach's public resurrection begins.", "d": "1829-03-11", "era": "The Rediscovery: 1829–1850", "flag": "Documented", "c": "#aecbe8", "eid": "revival", "img": "assets/images/thumbs/singakademie.jpg", "href": "events/revival/mendelssohn-revival-1829.html"}, {"y": 1850, "yf": 1850.574, "m": "28 July 1850", "t": "The centenary act: founding the Bach-Gesellschaft", "s": "On the hundredth anniversary of Bach's death, Schumann and allies found the Bach-Gesellschaft: 46 volumes over 50 years print everything — the complete works, custody made permanent.", "d": "1850-07-28", "era": "The Rediscovery: 1829–1850", "flag": "Documented", "c": "#aecbe8", "eid": "revival", "img": "assets/images/thumbs/bach-signature.png", "href": "events/revival/bach-gesellschaft-1850.html"}, {"y": 1871, "yf": 1871.5, "m": "c. 1871", "t": "The Romantic Bach: transcription as devotion", "s": "The nineteenth century absorbs Bach by rewriting him — Liszt's organ transcriptions, Busoni's Chaconne, the \"Air on the G string,\" Gounod's Ave Maria — devotion and distortion in the same gesture.", "d": "1871", "era": "The Living Bach: 1850–present", "flag": "Documented", "c": "#7fd4c1", "eid": "living-bach", "img": "assets/images/thumbs/liszt.jpg", "href": "events/living-bach/romantic-transcriptions.html"}, {"y": 1890, "yf": 1890.5, "m": "1890", "t": "A junk-shop score in Barcelona: Casals and the cello suites", "s": "Thirteen-year-old Pablo Casals finds a secondhand copy of the cello suites in a Barcelona shop, studies them for twelve years before performing one whole — and lifts the set from étude-shelf to scripture.", "d": "1890", "era": "The Living Bach: 1850–present", "flag": "Documented", "c": "#7fd4c1", "eid": "living-bach", "img": "assets/images/thumbs/casals.jpg", "href": "events/living-bach/casals-suites-1890.html"}, {"y": 1905, "yf": 1905.5, "m": "1905", "t": "Schweitzer's Bach: the tone-poet of the chorales", "s": "Albert Schweitzer's massive study reads Bach's figures as a pictorial language — and his organ-reform activism begins the turn from Romantic thunder toward clarity.", "d": "1905", "era": "The Living Bach: 1850–present", "flag": "Documented", "c": "#7fd4c1", "eid": "living-bach", "img": "assets/images/thumbs/schweitzer.jpg", "href": "events/living-bach/schweitzer-1905.html"}, {"y": 1955, "yf": 1955.458, "m": "June 1955", "t": "June 1955: Gould records the Goldbergs", "s": "A 22-year-old Canadian's debut LP — the Goldberg Variations, of all things — becomes a bestseller and makes contrapuntal clarity a modern thrill. He re-records it as his farewell in 1981.", "d": "1955-06-01", "era": "The Living Bach: 1850–present", "flag": "Documented", "c": "#7fd4c1", "eid": "living-bach", "img": "assets/images/thumbs/gould.jpg", "href": "events/living-bach/gould-1955.html"}, {"y": 1971, "yf": 1971.5, "m": "1971", "t": "The HIP revolution: Harnoncourt, Leonhardt, and the complete cantatas", "s": "Nikolaus Harnoncourt and Gustav Leonhardt spend eighteen years recording every sacred cantata on period instruments with boys' voices — historically informed performance's founding monument — and Rifkin's one-voice-per-part thesis pushes the question further.", "d": "1971", "era": "The Living Bach: 1850–present", "flag": "Documented", "c": "#7fd4c1", "eid": "living-bach", "img": "assets/images/thumbs/harnoncourt.jpg", "href": "events/living-bach/hip-1971.html"}, {"y": 1977, "yf": 1977.636, "m": "20 August 1977", "t": "1977: Bach leaves the solar system", "s": "The Voyager Golden Record carries three Bach works — more than any other composer — including the Second Brandenburg as its opening music. Lewis Thomas: \"I would vote for Bach, all of Bach.\"", "d": "1977-08-20", "era": "The Living Bach: 1850–present", "flag": "Documented", "c": "#7fd4c1", "eid": "living-bach", "img": "assets/images/thumbs/voyager-record.jpg", "href": "events/living-bach/voyager-1977.html"}, {"y": 1995, "yf": 1995.5, "m": "1995", "t": "The completeness era: Suzuki, Koopman, and All of Bach", "s": "Complete recorded surveys multiply — Suzuki's 18-year cantata edition from Japan, Koopman's from Amsterdam, the Netherlands Bach Society's free All of Bach films — and \"everything, beautifully performed, freely heard\" becomes the baseline.", "d": "1995", "era": "The Living Bach: 1850–present", "flag": "Documented", "c": "#7fd4c1", "eid": "living-bach", "img": "assets/images/thumbs/suzuki.jpg", "href": "events/living-bach/completeness-era.html"}, {"y": 2000, "yf": 2000.5, "m": "2000", "t": "The Bach Cantata Pilgrimage: a year inside the machine", "s": "For the 250th anniversary year 2000, Gardiner performs all the surviving sacred cantatas on their own liturgical dates, in churches across Europe — then founds his own label to release the results when DG walks away.", "d": "2000-01-01", "era": "The Living Bach: 1850–present", "flag": "Documented", "c": "#7fd4c1", "eid": "living-bach", "img": "assets/images/thumbs/gardiner.jpg", "href": "events/living-bach/gardiner-pilgrimage-2000.html"}];
