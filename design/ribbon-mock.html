<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Bach Timeline — design mock: the ribbon in space</title>
<style>
  :root{
    --gold:#e8c874; --gold-dim:#8a7440; --ember:#5a5266; --teal:#7fd4c1; --ice:#aecbe8;
    --ink:#1d1a16; --paper:#f7f3ea; --paper2:#efe9db;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#05060e;font-family:-apple-system,'Inter','Segoe UI',sans-serif;color:#cfd6e4}
  #space{position:fixed;inset:0;display:block}
  /* ---------- chrome ---------- */
  header{position:fixed;top:0;left:0;right:0;padding:26px 38px;z-index:5;pointer-events:none;
    display:flex;justify-content:space-between;align-items:baseline}
  header h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;letter-spacing:.24em;
    font-size:15px;text-transform:uppercase;color:#e9e2cf;opacity:.92}
  header h1 b{color:var(--gold);font-weight:400}
  header .hint{font-size:11.5px;letter-spacing:.08em;color:#7b8296;opacity:.85}
  footer{position:fixed;bottom:0;left:0;right:0;padding:18px 38px;z-index:5;pointer-events:none;
    display:flex;justify-content:space-between;font-size:11px;letter-spacing:.14em;color:#5d6478;text-transform:uppercase}
  /* ---------- era labels & nodes ---------- */
  #layer{position:fixed;inset:0;z-index:3}
  .era-label{position:absolute;transform:translateX(-50%);text-align:center;pointer-events:none;
    font-family:Georgia,serif;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#8f96ab;opacity:0;
    transition:opacity .6s}
  .era-label small{display:block;font-family:-apple-system,'Inter',sans-serif;font-size:10px;letter-spacing:.16em;color:#5d6478;margin-top:4px}
  .node{position:absolute;width:11px;height:11px;border-radius:50%;transform:translate(-50%,-50%);cursor:pointer;z-index:4}
  .node::after{content:'';position:absolute;inset:-9px;border-radius:50%}
  .node b{position:absolute;inset:0;border-radius:50%;background:var(--c,#e8c874);
    box-shadow:0 0 10px 2px var(--c,#e8c874),0 0 26px 6px color-mix(in srgb,var(--c,#e8c874) 45%, transparent)}
  .node:hover b{box-shadow:0 0 14px 4px var(--c),0 0 44px 12px color-mix(in srgb,var(--c) 60%, transparent)}
  .node .tip{position:absolute;bottom:22px;left:50%;transform:translateX(-50%) translateY(4px);white-space:nowrap;
    background:rgba(10,12,22,.92);border:1px solid rgba(232,200,116,.25);border-radius:3px;padding:7px 12px;
    font-size:12px;color:#e9e2cf;letter-spacing:.02em;opacity:0;pointer-events:none;transition:.18s}
  .node .tip small{display:block;color:#8f96ab;font-size:10.5px;letter-spacing:.12em;margin-top:2px}
  .node:hover .tip{opacity:1;transform:translateX(-50%) translateY(0)}
  /* ---------- museum panel ---------- */
  #veil{position:fixed;inset:0;background:rgba(3,4,10,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.45s;z-index:8}
  #museum{position:fixed;top:0;right:0;bottom:0;width:min(560px,92vw);background:var(--paper);color:var(--ink);
    transform:translateX(103%);transition:transform .55s cubic-bezier(.22,.8,.24,1);z-index:9;
    box-shadow:-30px 0 80px rgba(0,0,0,.55);display:flex;flex-direction:column}
  #museum.open{transform:none}
  #veil.open{opacity:1;pointer-events:auto}
  .m-head{padding:44px 48px 26px;border-bottom:1px solid #ddd5c2}
  .m-era{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:#9a8b62;margin-bottom:14px}
  .m-title{font-family:Georgia,serif;font-size:27px;line-height:1.22;font-weight:400}
  .m-date{margin-top:10px;font-size:13px;color:#6d675c;font-style:italic;font-family:Georgia,serif}
  .m-body{padding:30px 48px 48px;overflow-y:auto;font-family:Georgia,serif;font-size:15.5px;line-height:1.72;color:#2b2620}
  .m-body p{margin-bottom:1.1em}
  .m-body .why{margin-top:1.6em;padding-top:1.2em;border-top:1px solid #ddd5c2}
  .m-body .why em{color:#7a6a3e}
  .chip{display:inline-block;font-family:-apple-system,'Inter',sans-serif;font-size:10px;letter-spacing:.22em;text-transform:uppercase;
    padding:4px 10px;border:1px solid #c9bd9e;border-radius:2px;color:#7a6a3e;margin-bottom:16px}
  .m-close{position:absolute;top:18px;right:20px;width:34px;height:34px;border:none;background:none;cursor:pointer;
    color:#8a8272;font-size:21px;line-height:1}
  .m-close:hover{color:#1d1a16}
  .m-foot{padding:16px 48px;border-top:1px solid #ddd5c2;background:var(--paper2);
    font-family:-apple-system,'Inter',sans-serif;font-size:11px;letter-spacing:.1em;color:#8a8272;text-transform:uppercase}
  @media (prefers-reduced-motion: reduce){ .rm-hide{display:none} }
</style>
</head>
<body>
<canvas id="space"></canvas>
<div id="layer"></div>

<header>
  <h1>The <b>Bach</b> Timeline</h1>
  <div class="hint">scroll / pinch to zoom &nbsp;·&nbsp; drag to travel &nbsp;·&nbsp; click a light to enter</div>
</header>
<footer>
  <div>1685 — the music begins</div>
  <div id="readout">340 years</div>
  <div>1977 — and leaves the solar system</div>
</footer>

<div id="veil"></div>
<aside id="museum" aria-hidden="true">
  <button class="m-close" aria-label="close">×</button>
  <div class="m-head">
    <div class="m-era" id="m-era"></div>
    <div class="m-title" id="m-title"></div>
    <div class="m-date" id="m-date"></div>
  </div>
  <div class="m-body" id="m-body"></div>
  <div class="m-foot">Sources · Wolff, The Learned Musician &nbsp;·&nbsp; The New Bach Reader</div>
</aside>

<script>
'use strict';
/* ============ sample data (real cards, abridged) ============ */
const ERAS = [
  {y0:1685,y1:1750,name:'The Life',sub:'1685 – 1750',c:'#e8c874',glow:1.0},
  {y0:1750,y1:1829,name:'The Eclipse',sub:'1750 – 1829',c:'#66607a',glow:0.38},
  {y0:1829,y1:1900,name:'The Rediscovery',sub:'1829 – 1850 →',c:'#aecbe8',glow:0.8},
  {y0:1900,y1:1990,name:'The Living Bach',sub:'1850 – present',c:'#7fd4c1',glow:0.95},
];
const EVENTS = [
 {y:1685,t:'Birth of Johann Sebastian Bach',d:'21 March 1685 · Eisenach',era:0,flag:'Documented',
  body:`<p>Johann Sebastian Bach is born the eighth and youngest child of Eisenach's town musician, and baptized two days later at the Georgenkirche — the church where Luther once preached. To be born a Bach, in Luther's town, in musical Thuringia, was to inherit craft, faith, and region at once.</p>`,
  why:`1685 is the great vintage year of the Baroque — Handel born a month earlier, eighty miles away.`},
 {y:1705,t:'The 250-mile walk to Buxtehude',d:'October 1705 · Arnstadt → Lübeck',era:0,flag:'Documented',
  body:`<p>Granted four weeks' leave, the twenty-year-old organist walks some 250 miles north to hear Dieterich Buxtehude — and stays four months, through the great Abendmusik concerts, returning to face his employers with the least apologetic justification in the annals of employment: he had gone <i>"to comprehend one thing and another about his art."</i></p>`,
  why:`The purest expression of how Bach learned: when he wanted knowledge, he walked to the source and overstayed.`},
 {y:1717,t:'A month in the Duke’s jail',d:'6 Nov – 2 Dec 1717 · Weimar',era:0,flag:'Documented',
  body:`<p>For "too stubbornly forcing the issue of his dismissal," Duke Wilhelm Ernst imprisons his court organist for nearly four weeks, then dismisses him in disgrace. Bach leaves immediately for Cöthen — where the greatest instrumental music of the century is waiting to be written.</p>`,
  why:`The freedom of the Cöthen years was purchased with a month in a cell — working conditions, 1717.`},
 {y:1721,t:'Six concertos posted to Brandenburg',d:'24 March 1721 · Cöthen',era:0,flag:'Documented',
  body:`<p>Bach signs the French dedication of <i>Six Concerts avec plusieurs instruments</i> to the Margrave of Brandenburg — a beautifully copied job application that was likely never performed by its recipient, sold for a trivial sum at his death, and is now among the most treasured manuscripts on earth.</p>`,
  why:`The gap between the artifact's fate and its eventual glory is this timeline's whole reception story, in miniature.`},
 {y:1727,t:'The St. Matthew Passion',d:'Good Friday 1727 · Thomaskirche, Leipzig',era:0,flag:'Documented',
  body:`<p>Two choirs, two orchestras, three hours: the largest music ever mounted in the Thomaskirche. Contemporary reception: silence — not one review or diary entry survives. Performed a few times under Bach, then not at all, for a hundred years.</p>`,
  why:`Arc I's summit; Arc II's sleeping giant; the work whose awakening restarts everything.`},
 {y:1747,t:'"Old Bach is come" — Potsdam',d:'7–8 May 1747 · Sanssouci',era:0,flag:'Documented',
  body:`<p>Frederick the Great cancels his evening concert, walks the old cantor through his fortepiano collection, and sets him a chromatic theme. Bach improvises a three-voice fugue on the spot — and goes home to build the <i>Musical Offering</i> around the challenge.</p>`,
  why:`The Enlightenment's future meeting counterpoint's past, in one candle-lit room.`},
 {y:1750,t:'Death of Bach — the estate scatters',d:'28 July 1750 · Leipzig',era:0,flag:'Documented',
  body:`<p>Blinded by a quack oculist's operations, Bach dies at sixty-five and is buried without a gravestone. The manuscripts divide among nine heirs; perhaps two-fifths of the life's work will dissolve through auction rooms — the ribbon dims here, and the design is honest.</p>`,
  why:`The eclipse was a failure of custody before it was a failure of taste.`},
 {y:1789,t:'Mozart, ambushed by a motet',d:'April 1789 · Thomaskirche',era:1,flag:'Tradition',
  body:`<p>Visiting Leipzig, Mozart hears the choir sing <i>Singet dem Herrn</i> — music that never stopped being sung in this one room while the world forgot it. A few bars in, he sits up: <i>"Now, there is something one can learn from!"</i> — and reads every part in the school's possession, pages spread on his knees and the chairs around him.</p>`,
  why:`The era's greatest living composer, readmitting the dead cantor to history — by professional judgment.`},
 {y:1829,t:'The Passion returns — Mendelssohn, aged 20',d:'11 March 1829 · Berlin Singakademie',era:2,flag:'Documented',
  body:`<p>A century after Leipzig heard it, the twenty-year-old Mendelssohn conducts the St. Matthew Passion from memory before Berlin's whole intellectual world — Hegel and Heine in the hall, a thousand turned away. The audience weeps openly; the ribbon reignites.</p>`,
  why:`The single most consequential concert in Western music history.`},
 {y:1850,t:'The Bach-Gesellschaft founded',d:'28 July 1850 · Leipzig',era:2,flag:'Documented',
  body:`<p>On the death-centenary, Schumann and allies constitute a society with one object: print <b>everything</b>. Forty-six volumes over fifty years rebuild the custody one family lost — and from here forward, Bach's survival never again depends on any attic or accident.</p>`,
  why:`What one family lost, one century's scholarship rebuilt.`},
 {y:1890,t:'A junk-shop score in Barcelona',d:'1890 · Casals, aged 13',era:3,flag:'Tradition',
  body:`<p>A boy pulls a worn volume from a secondhand shop near the harbor: <i>Six Suites for Violoncello Solo</i> — music almost nobody then knew. He studies it daily for twelve years before performing one suite in public, and lifts the set from the étude shelf to scripture.</p>`,
  why:`The greatest works can wait a century on the shelf — for someone who takes them literally.`},
 {y:1955,t:'Gould records the Goldbergs',d:'June 1955 · New York',era:3,flag:'Documented',
  body:`<p>A twenty-two-year-old Canadian insists his debut LP be the Goldberg Variations. Columbia thinks it commercial suicide. The record becomes a bestseller — and a generation discovers that counterpoint can hit like jazz.</p>`,
  why:`Track one of the case that Bach is contemporary music.`},
 {y:1977,t:'Bach leaves the solar system',d:'20 August 1977 · Voyager',era:3,flag:'Documented',
  body:`<p>The Golden Record carries three Bach works — more than any other composer — with the Second Brandenburg as humanity's opening statement. <i>"I would vote for Bach, all of Bach,"</i> said Lewis Thomas. <i>"We would be bragging, but it is surely excusable."</i></p>`,
  why:`The streams flowing off this ribbon stopped being a metaphor on this date.`},
];

/* ============ view state ============ */
let Y0 = 1670, Y1 = 2000;                       // visible year-domain
const canvas = document.getElementById('space');
const ctx = canvas.getContext('2d');
let W=0, H=0, DPR=1, ribbonY=0;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function resize(){
  DPR = Math.min(devicePixelRatio||1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ribbonY = H*0.56;
  makeStars(); layout();
}
const X = y => (y - Y0)/(Y1 - Y0) * W;
const YEAR = x => Y0 + x/W*(Y1-Y0);

/* ============ starfield ============ */
let stars=[];
function makeStars(){
  stars = Array.from({length: Math.floor(W*H/4200)}, () => ({
    x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.15+0.2,
    tw:Math.random()*Math.PI*2, sp:0.3+Math.random()*1.2
  }));
}

/* ============ music streams (particles off the ribbon) ============ */
const streams=[];
function eraAt(y){ return ERAS.find(e=>y>=e.y0&&y<e.y1) || ERAS[ERAS.length-1]; }
function spawn(){
  if(reduced) return;
  const yr = Y0 + Math.random()*(Y1-Y0);
  if(yr<1685) return;
  const e = eraAt(Math.min(yr,1989));
  if(Math.random() > e.glow*0.9) return;           // dim eras shed fewer streams
  streams.push({x:X(yr), y:ribbonY, vx:(Math.random()-.35)*0.22, vy:-(0.25+Math.random()*0.55),
    life:1, decay:0.0016+Math.random()*0.0022, c:e.c, w:Math.random()<0.12?1.6:0.9, ph:Math.random()*6.28});
}

/* ============ ribbon ============ */
function drawRibbon(t){
  const seg = 4;
  for(let x=0; x<=W; x+=seg){
    const yr = YEAR(x);
    if(yr<1685) continue;
    const e = eraAt(Math.min(yr,1989));
    // eclipse fades toward its middle, revival brightens toward present
    let g = e.glow;
    if(e===ERAS[1]){ const p=(yr-1750)/79; g = 0.55 - 0.35*Math.sin(p*Math.PI)*0.9; }
    if(e===ERAS[2]){ g = 0.45 + 0.5*((yr-1829)/71); }
    const wob = Math.sin(x*0.01 + t*0.0006)*2.2;
    const h = 7 + 9*g + Math.sin(x*0.035+t*0.001)*1.6*g;
    const grd = ctx.createLinearGradient(0,ribbonY-h+wob,0,ribbonY+h+wob);
    grd.addColorStop(0,'transparent'); grd.addColorStop(.5,e.c); grd.addColorStop(1,'transparent');
    ctx.globalAlpha = 0.16 + 0.5*g;
    ctx.fillStyle = grd;
    ctx.fillRect(x, ribbonY-h+wob, seg+1, h*2);
    // bright core line
    ctx.globalAlpha = 0.35 + 0.6*g;
    ctx.fillStyle = e.c;
    ctx.fillRect(x, ribbonY-0.7+wob, seg+1, 1.4);
  }
  ctx.globalAlpha = 1;
}

/* ============ animation ============ */
function frame(t){
  ctx.clearRect(0,0,W,H);
  // deep space vignette
  const bg = ctx.createRadialGradient(W/2,H*0.5,H*0.1, W/2,H*0.55,H*0.95);
  bg.addColorStop(0,'#0a0d1d'); bg.addColorStop(1,'#04050c');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
  // stars
  for(const s of stars){
    const a = reduced? 0.5 : 0.28+0.5*Math.abs(Math.sin(s.tw + t*0.00045*s.sp));
    ctx.globalAlpha=a; ctx.fillStyle='#c9d4ea';
    ctx.fillRect(s.x,s.y,s.r,s.r);
  }
  ctx.globalAlpha=1;
  // streams
  for(let i=0;i<3;i++) spawn();
  for(let i=streams.length-1;i>=0;i--){
    const p=streams[i];
    p.x+=p.vx+Math.sin(t*0.001+p.ph)*0.12; p.y+=p.vy; p.life-=p.decay;
    if(p.life<=0||p.y<-20){streams.splice(i,1);continue;}
    ctx.globalAlpha=p.life*0.55; ctx.fillStyle=p.c;
    ctx.fillRect(p.x,p.y,p.w,p.w*2.4);
  }
  ctx.globalAlpha=1;
  drawRibbon(t);
  requestAnimationFrame(frame);
}

/* ============ DOM layer: labels + nodes ============ */
const layer=document.getElementById('layer');
function layout(){
  layer.innerHTML='';
  for(const e of ERAS){
    if(e.y1<Y0||e.y0>Y1) continue;
    const mid=(Math.max(e.y0,Y0)+Math.min(e.y1,Y1))/2;
    const el=document.createElement('div'); el.className='era-label';
    el.style.left=X(mid)+'px'; el.style.top=(ribbonY+46)+'px';
    el.innerHTML=`${e.name}<small>${e.sub}</small>`;
    layer.appendChild(el);
    requestAnimationFrame(()=>el.style.opacity=.9);
  }
  EVENTS.forEach((ev,i)=>{
    if(ev.y<Y0||ev.y>Y1) return;
    const n=document.createElement('div'); n.className='node';
    n.style.left=X(ev.y)+'px';
    n.style.top=(ribbonY + (i%2?-30:26)*(0.45+0.55*ERAS[ev.era].glow))+'px';
    n.style.setProperty('--c',ERAS[ev.era].c);
    n.innerHTML=`<b></b><span class="tip">${ev.t}<small>${ev.y} · ${ERAS[ev.era].name}</small></span>`;
    n.onclick=()=>openMuseum(ev);
    layer.appendChild(n);
  });
  document.getElementById('readout').textContent =
    Math.round(Y0)+' – '+Math.round(Y1)+'  ·  '+Math.round(Y1-Y0)+' years in view';
}

/* ============ zoom & pan ============ */
addEventListener('wheel',e=>{
  e.preventDefault();
  const anchor=YEAR(e.clientX);
  const f = Math.exp(e.deltaY*0.0012);
  let span=(Y1-Y0)*f; span=Math.max(12,Math.min(360,span));
  const k=(anchor-Y0)/(Y1-Y0);
  Y0=anchor-k*span; Y1=Y0+span;
  clampDomain(); layout();
},{passive:false});
let drag=null;
addEventListener('pointerdown',e=>{ if(e.target.closest('#museum'))return; drag={x:e.clientX,Y0,Y1}; });
addEventListener('pointermove',e=>{
  if(!drag)return;
  const dy=(drag.x-e.clientX)/W*(drag.Y1-drag.Y0);
  Y0=drag.Y0+dy; Y1=drag.Y1+dy; clampDomain(); layout();
});
addEventListener('pointerup',()=>drag=null);
function clampDomain(){
  const span=Y1-Y0;
  if(Y0<1600){Y0=1600;Y1=1600+span;}
  if(Y1>2050){Y1=2050;Y0=2050-span;}
}

/* ============ museum panel ============ */
const museum=document.getElementById('museum'), veil=document.getElementById('veil');
function openMuseum(ev){
  document.getElementById('m-era').textContent = ERAS[ev.era].name+' · '+ev.flag;
  document.getElementById('m-title').textContent = ev.t;
  document.getElementById('m-date').textContent = ev.d;
  document.getElementById('m-body').innerHTML =
    `<span class="chip">${ev.flag}</span>`+ev.body+
    `<p class="why"><em>Why it matters.</em> ${ev.why}</p>`;
  museum.classList.add('open'); veil.classList.add('open');
  museum.setAttribute('aria-hidden','false');
}
function closeMuseum(){ museum.classList.remove('open'); veil.classList.remove('open'); museum.setAttribute('aria-hidden','true'); }
veil.onclick=closeMuseum;
document.querySelector('.m-close').onclick=closeMuseum;
addEventListener('keydown',e=>{ if(e.key==='Escape') closeMuseum(); });

/* ============ go ============ */
addEventListener('resize',resize);
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
