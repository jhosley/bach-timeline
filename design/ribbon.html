<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Bach Timeline</title>
<style>
  :root{ --gold:#e8c874; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#05060e;font-family:-apple-system,'Inter','Segoe UI',sans-serif;color:#cfd6e4}
  #space,#layer{touch-action:none}
  #space{position:fixed;inset:0;display:block}
  header{position:fixed;top:0;left:0;right:0;padding:22px 34px;z-index:5;pointer-events:none;
    display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  header h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;letter-spacing:.24em;
    font-size:15px;text-transform:uppercase;color:#e9e2cf;opacity:.92;white-space:nowrap}
  header h1 b{color:var(--gold);font-weight:400}
  header .hint{font-size:11.5px;letter-spacing:.08em;color:#7b8296;opacity:.85;text-align:right}
  footer{position:fixed;bottom:0;left:0;right:0;padding:16px 34px;z-index:5;pointer-events:none;
    display:flex;justify-content:space-between;gap:10px;font-size:11px;letter-spacing:.14em;color:#5d6478;text-transform:uppercase}
  #layer{position:fixed;inset:0;z-index:3}
  .era-label{position:absolute;transform:translateX(-50%);text-align:center;pointer-events:none;
    font-family:Georgia,serif;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#8f96ab;opacity:0;
    transition:opacity .5s;white-space:nowrap}
  .era-label small{display:block;font-family:-apple-system,'Inter',sans-serif;font-size:10px;letter-spacing:.16em;color:#5d6478;margin-top:4px}
  .era-label.sub{font-size:10.5px;letter-spacing:.2em;color:#a08c58}
  .node{position:absolute;width:11px;height:11px;border-radius:50%;transform:translate(-50%,-50%);cursor:pointer;z-index:4}
  .node::after{content:'';position:absolute;inset:-9px;border-radius:50%}
  .node b{position:absolute;inset:0;border-radius:50%;background:var(--c,#e8c874);
    box-shadow:0 0 10px 2px var(--c,#e8c874),0 0 26px 6px color-mix(in srgb,var(--c,#e8c874) 45%, transparent)}
  .node:hover b{box-shadow:0 0 14px 4px var(--c),0 0 44px 12px color-mix(in srgb,var(--c) 60%, transparent)}
  .node .tip{position:absolute;bottom:22px;left:50%;transform:translateX(-50%) translateY(4px);white-space:nowrap;
    background:rgba(10,12,22,.92);border:1px solid rgba(232,200,116,.25);border-radius:3px;padding:7px 12px;
    font-size:12px;color:#e9e2cf;letter-spacing:.02em;opacity:0;pointer-events:none;transition:.18s;z-index:7}
  .node .tip small{display:block;color:#8f96ab;font-size:10.5px;letter-spacing:.12em;margin-top:2px}
  .node .stem{position:absolute;top:100%;left:50%;width:1px;margin-left:-0.5px;pointer-events:none;
    background:linear-gradient(to bottom, color-mix(in srgb,var(--c,#e8c874) 40%, transparent), transparent)}
  .node .yr{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:9.5px;
    letter-spacing:.08em;color:#8d94a8;pointer-events:none;font-family:-apple-system,'Inter',sans-serif}
  @media (hover:hover){ .node:hover .tip{opacity:1;transform:translateX(-50%) translateY(0)} }
  #veil{position:fixed;inset:0;background:rgba(3,4,10,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.45s;z-index:8}
  #museum{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:#f7f3ea;color:#1d1a16;
    transform:translateX(103%);transition:transform .5s cubic-bezier(.22,.8,.24,1);z-index:9;
    box-shadow:-30px 0 80px rgba(0,0,0,.55);display:flex;flex-direction:column}
  #museum.open{transform:none}
  #veil.open{opacity:1;pointer-events:auto}
  .m-head{padding:42px 44px 24px;border-bottom:1px solid #ddd5c2}
  .m-era{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:#9a8b62;margin-bottom:13px}
  .m-title{font-family:Georgia,serif;font-size:26px;line-height:1.22;font-weight:400}
  .m-date{margin-top:9px;font-size:13px;color:#6d675c;font-style:italic;font-family:Georgia,serif}
  .m-body{padding:28px 44px 44px;overflow-y:auto;font-family:Georgia,serif;font-size:15.5px;line-height:1.7;color:#2b2620;-webkit-overflow-scrolling:touch}
  .m-body p{margin-bottom:1.1em}
  .m-body a{color:#7a6a3e}
  .chip{display:inline-block;font-family:-apple-system,'Inter',sans-serif;font-size:10px;letter-spacing:.22em;text-transform:uppercase;
    padding:4px 10px;border:1px solid #c9bd9e;border-radius:2px;color:#7a6a3e;margin-bottom:16px}
  .m-close{position:absolute;top:12px;right:12px;width:44px;height:44px;border:none;background:none;cursor:pointer;
    color:#8a8272;font-size:26px;line-height:1;z-index:2}
  .m-close:hover{color:#1d1a16}
  /* ---------- phone ---------- */
  @media (max-width:640px){
    header{padding:14px 16px;flex-direction:column;align-items:flex-start;gap:4px}
    header h1{font-size:12.5px;letter-spacing:.2em}
    header .hint{font-size:10px;text-align:left}
    footer{padding:12px 16px;font-size:9px;letter-spacing:.08em}
    footer div:nth-child(1),footer div:nth-child(3){display:none}
    footer{justify-content:center}
    .m-head{padding:34px 24px 20px}
    .m-body{padding:22px 24px 40px;font-size:15px}
    .m-title{font-size:22px}
    .era-label{font-size:10px;letter-spacing:.18em}
    .era-label.sub{display:none}
  }
  @media (pointer:coarse){
    .node{width:14px;height:14px}
    .node::after{inset:-13px}
  }
  @media (max-width:640px){
    .node{width:9px;height:9px}
    .node::after{inset:-12px}
    .node b{box-shadow:0 0 6px 1px var(--c,#e8c874),0 0 14px 3px color-mix(in srgb,var(--c,#e8c874) 40%, transparent)}
  }
  @media (prefers-reduced-motion: reduce){ .rm-hide{display:none} }
</style>
</head>
<body>
<canvas id="space"></canvas>
<div id="layer"></div>

<header>
  <h1>The <b>Bach</b> Timeline</h1>
  <div class="hint" id="hint">scroll / pinch to zoom · drag to travel · click a light to enter</div>
</header>
<footer>
  <div>1685 — the music begins</div>
  <div id="readout"></div>
  <div>1977 — and leaves the solar system</div>
</footer>

<div id="veil"></div>
<aside id="museum" aria-hidden="true">
  <button class="m-close" aria-label="close">×</button>
  <div class="m-head">
    <div class="m-era" id="m-era"></div>
    <div class="m-title" id="m-title"></div>
    <div class="m-date" id="m-date"></div>
  </div>
  <div class="m-body" id="m-body"></div>
</aside>

<script>
'use strict';
const EVENTS = [/*__EVENTS__*/];

/* ---------- density-weighted (warped) time axis ----------
   Each segment of history gets screen share by WEIGHT, not by years:
   the Life holds most of the lights, so it gets most of the space. */
const SEGMENTS = [
  {y0:1670, y1:1685, w:0.015},
  {y0:1685, y1:1750, w:0.62},   // The Life
  {y0:1750, y1:1829, w:0.115},  // The Eclipse
  {y0:1829, y1:1900, w:0.095},  // The Rediscovery
  {y0:1900, y1:1990, w:0.135},  // The Living Bach
  {y0:1990, y1:2010, w:0.02},
];
(()=>{ let u=0; for(const s of SEGMENTS){ s.u0=u; u+=s.w; s.u1=u; } })();
function U(y){                      // year -> warped [0,1]
  for(const s of SEGMENTS) if(y<=s.y1||s===SEGMENTS[SEGMENTS.length-1])
    if(y>=s.y0||s===SEGMENTS[0]) if(y<=s.y1) return s.u0+(Math.max(y,s.y0)-s.y0)/(s.y1-s.y0)*s.w;
  return 1;
}
function YR(u){                     // warped -> year
  u=Math.max(0,Math.min(1,u));
  for(const s of SEGMENTS) if(u<=s.u1) return s.y0+(u-s.u0)/s.w*(s.y1-s.y0);
  return SEGMENTS[SEGMENTS.length-1].y1;
}

const ARCS = [
  {y0:1685,y1:1750,name:'The Life',sub:'1685 – 1750',c:'#e8c874',glow:1.0},
  {y0:1750,y1:1829,name:'The Eclipse',sub:'1750 – 1829',c:'#66607a',glow:0.38},
  {y0:1829,y1:1900,name:'The Rediscovery',sub:'1829 – 1850 →',c:'#aecbe8',glow:0.8},
  {y0:1900,y1:1990,name:'The Living Bach',sub:'1850 – present',c:'#7fd4c1',glow:0.95},
];
const LIFE_ERAS = [
  {y0:1685,y1:1695,n:'Eisenach'},{y0:1695,y1:1700,n:'Ohrdruf'},{y0:1700,y1:1703,n:'Lüneburg'},
  {y0:1703,y1:1707,n:'Arnstadt'},{y0:1707,y1:1708,n:'Mühlhausen'},{y0:1708,y1:1717,n:'Weimar'},
  {y0:1717,y1:1723,n:'Cöthen'},{y0:1723,y1:1729,n:'Leipzig I'},{y0:1729,y1:1741,n:'Leipzig II'},{y0:1741,y1:1750,n:'Leipzig III'},
];

/* ---------- view state: warped window [U0,U1] ---------- */
let U0=0, U1=1;
const canvas=document.getElementById('space'), ctx=canvas.getContext('2d');
let W=0,H=0,DPR=1,ribbonY=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse=matchMedia('(pointer: coarse)').matches;
if(coarse) document.getElementById('hint').textContent='pinch to zoom · drag to travel · tap a light to enter';

const X = y => (U(y)-U0)/(U1-U0)*W;
const uAt = x => U0 + x/W*(U1-U0);

function resize(){
  DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
  canvas.width=W*DPR; canvas.height=H*DPR;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ribbonY=H*0.70; makeStars(); layout();
}

/* ---------- stars & streams ---------- */
let stars=[];
function makeStars(){ stars=Array.from({length:Math.floor(W*H/4200)},()=>({
  x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.15+0.2,tw:Math.random()*6.28,sp:0.3+Math.random()*1.2})); }
const streams=[];
function arcAt(y){ return ARCS.find(a=>y>=a.y0&&y<a.y1)||ARCS[ARCS.length-1]; }
function spawn(){
  if(reduced) return;
  const u=U0+Math.random()*(U1-U0), yr=YR(u);
  if(yr<1685) return;
  const a=arcAt(Math.min(yr,1989));
  if(Math.random()>a.glow*0.9) return;
  streams.push({x:(u-U0)/(U1-U0)*W,y:ribbonY,vx:(Math.random()-.35)*0.22,vy:-(0.25+Math.random()*0.55),
    life:1,decay:0.0016+Math.random()*0.0022,c:a.c,w:Math.random()<0.12?1.6:0.9,ph:Math.random()*6.28});
}
function drawRibbon(t){
  const seg=4;
  for(let x=0;x<=W;x+=seg){
    const yr=YR(uAt(x));
    if(yr<1685) continue;
    const a=arcAt(Math.min(yr,1989));
    let g=a.glow;
    if(a===ARCS[1]){const p=(yr-1750)/79; g=0.55-0.35*Math.sin(p*Math.PI)*0.9;}
    if(a===ARCS[2]){g=0.45+0.5*((yr-1829)/71);}
    const wob=Math.sin(x*0.01+t*0.0006)*2.2;
    const h=7+9*g+Math.sin(x*0.035+t*0.001)*1.6*g;
    const grd=ctx.createLinearGradient(0,ribbonY-h+wob,0,ribbonY+h+wob);
    grd.addColorStop(0,'transparent');grd.addColorStop(.5,a.c);grd.addColorStop(1,'transparent');
    ctx.globalAlpha=0.16+0.5*g; ctx.fillStyle=grd; ctx.fillRect(x,ribbonY-h+wob,seg+1,h*2);
    ctx.globalAlpha=0.35+0.6*g; ctx.fillStyle=a.c; ctx.fillRect(x,ribbonY-0.7+wob,seg+1,1.4);
  }
  ctx.globalAlpha=1;
}
function frame(t){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createRadialGradient(W/2,H*0.5,H*0.1,W/2,H*0.55,H*0.95);
  bg.addColorStop(0,'#0a0d1d');bg.addColorStop(1,'#04050c');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  for(const s of stars){
    ctx.globalAlpha=reduced?0.5:0.28+0.5*Math.abs(Math.sin(s.tw+t*0.00045*s.sp));
    ctx.fillStyle='#c9d4ea'; ctx.fillRect(s.x,s.y,s.r,s.r);
  }
  ctx.globalAlpha=1;
  for(let i=0;i<3;i++) spawn();
  for(let i=streams.length-1;i>=0;i--){
    const p=streams[i];
    p.x+=p.vx+Math.sin(t*0.001+p.ph)*0.12;p.y+=p.vy;p.life-=p.decay;
    if(p.life<=0||p.y<-20){streams.splice(i,1);continue;}
    ctx.globalAlpha=p.life*0.55;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.w,p.w*2.4);
  }
  ctx.globalAlpha=1; drawRibbon(t); drawTicks();
  requestAnimationFrame(frame);
}

/* ---------- year ticks on the line ---------- */
function drawTicks(){
  ctx.font='10px -apple-system, Inter, sans-serif'; ctx.textAlign='center';
  let lastX=-1e9;
  for(const s of SEGMENTS){
    const pxPerYear=(s.w/(U1-U0))*W/(s.y1-s.y0);
    let step=[1,2,5,10,20,25,50,100].find(st=>st*pxPerYear>=64)||100;
    const yStart=Math.max(s.y0, YR(U0)), yEnd=Math.min(s.y1, YR(U1));
    for(let y=Math.ceil(yStart/step)*step; y<=yEnd; y+=step){
      if(y<1685||y>2005) continue;
      const x=X(y);
      if(x-lastX<46) continue;
      lastX=x;
      ctx.globalAlpha=0.55; ctx.strokeStyle='#7b8296';
      ctx.beginPath(); ctx.moveTo(x,ribbonY+9); ctx.lineTo(x,ribbonY+16); ctx.stroke();
      ctx.globalAlpha=0.75; ctx.fillStyle='#7b8296';
      ctx.fillText(String(y), x, ribbonY+30);
    }
  }
  ctx.globalAlpha=1;
}

/* ---------- DOM layer ---------- */
const layer=document.getElementById('layer');
const ROW_H=38, FIRST_ROW=44, MINGAP=42;   // px between stacked rows / above-line offset / min horizontal spacing per row
function layout(){
  layer.innerHTML='';
  const yearsVisible=YR(U1)-YR(U0);
  const showSub = yearsVisible < 150;
  const showYears = yearsVisible < 80;
  /* --- era labels: BELOW the line, under the tick captions — nodes never come here --- */
  let stag=0;
  for(const a of ARCS){
    const u0=Math.max(U(a.y0),U0), u1=Math.min(U(a.y1),U1);
    if(u1<=U0||u0>=U1) continue;
    if(showSub && a===ARCS[0]) continue;
    const bandPx=(u1-u0)/(U1-U0)*W;
    if(bandPx < 120) continue;
    const el=document.createElement('div');el.className='era-label';
    el.style.left=Math.max(130,Math.min(W-130,((u0+u1)/2-U0)/(U1-U0)*W))+'px';
    el.style.top=(ribbonY+48+(bandPx<220?(stag++%2)*34:0))+'px';
    el.innerHTML=`${a.name}<small>${a.sub}</small>`;
    el.style.opacity=.9; layer.appendChild(el);
  }
  if(showSub) for(const e of LIFE_ERAS){
    const u0=Math.max(U(e.y0),U0), u1=Math.min(U(e.y1),U1);
    if(u1<=U0||u0>=U1) continue;
    if((u1-u0)/(U1-U0)*W < 60) continue;
    const el=document.createElement('div');el.className='era-label sub';
    el.style.left=((u0+u1)/2-U0)/(U1-U0)*W+'px'; el.style.top=(ribbonY+48)+'px';
    el.innerHTML=`${e.n}<small>${e.y0} – ${e.y1}</small>`;
    el.style.opacity=.9; layer.appendChild(el);
  }
  /* --- nodes: ALL ABOVE the line, greedy row-stacking so nothing overlaps --- */
  const maxRows=Math.max(3, Math.floor((ribbonY-130)/ROW_H));
  const rowLastX=[];
  const visible=EVENTS.filter(ev=>{const u=U(ev.y);return u>=U0&&u<=U1;})
                      .sort((a,b)=>a.y-b.y);
  for(const ev of visible){
    const x=(U(ev.y)-U0)/(U1-U0)*W;
    let row=0;
    while(row<maxRows && rowLastX[row]!==undefined && x-rowLastX[row]<MINGAP) row++;
    if(row>=maxRows){ // find the roomiest row rather than overflowing off-screen
      row=0; let best=-1e9;
      for(let r=0;r<maxRows;r++){const gap=x-(rowLastX[r]??-1e9); if(gap>best){best=gap;row=r;}}
    }
    rowLastX[row]=x;
    const top=ribbonY-FIRST_ROW-row*ROW_H;
    const n=document.createElement('div');n.className='node';
    n.style.left=x+'px'; n.style.top=top+'px';
    n.style.setProperty('--c',ev.c);
    const stemH=ribbonY-top-8;
    n.innerHTML=`<b></b><i class="stem" style="height:${stemH}px"></i>`
      +(showYears?`<span class="yr">${ev.y}</span>`:'')
      +`<span class="tip">${ev.t}<small>${ev.y} · ${ev.era}</small></span>`;
    n.addEventListener('click',e=>{e.stopPropagation();openMuseum(ev);});
    layer.appendChild(n);
  }
  document.getElementById('readout').textContent=
    Math.round(YR(U0))+' – '+Math.round(YR(U1));
}

/* ---------- zoom / pan / pinch / double-tap ---------- */
const MIN_SPAN=0.02;
function setView(u0,u1){
  let span=Math.max(MIN_SPAN,Math.min(1,u1-u0));
  u0=Math.max(0,Math.min(1-span,u0));
  U0=u0;U1=u0+span; layout();
}
addEventListener('wheel',e=>{
  e.preventDefault();
  const anchor=uAt(e.clientX), f=Math.exp(e.deltaY*0.0012);
  const span=(U1-U0)*f, k=(anchor-U0)/(U1-U0);
  setView(anchor-k*span, anchor-k*span+span);
},{passive:false});

const ptrs=new Map(); let pinch=null, drag=null, lastTap={t:0,x:0};
addEventListener('pointerdown',e=>{
  if(e.target.closest('#museum')||e.target.closest('nav'))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){
    const [a,b]=[...ptrs.values()];
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y),span:U1-U0,mid:uAt((a.x+b.x)/2),k:((a.x+b.x)/2)/W};
    drag=null;
  } else if(ptrs.size===1){
    drag={x:e.clientX,U0,U1};
  }
});
addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size===2){
    const [a,b]=[...ptrs.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y)||1;
    let span=pinch.span*pinch.d/d;
    span=Math.max(MIN_SPAN,Math.min(1,span));
    setView(pinch.mid-pinch.k*span, pinch.mid-pinch.k*span+span);
  } else if(drag&&ptrs.size===1){
    const du=(drag.x-e.clientX)/W*(drag.U1-drag.U0);
    setView(drag.U0+du, drag.U1+du);
  }
});
function ptrUp(e){
  if(ptrs.has(e.pointerId)&&ptrs.size===1&&drag&&Math.abs(e.clientX-drag.x)<8){
    const now=performance.now();
    if(now-lastTap.t<320&&Math.abs(e.clientX-lastTap.x)<30&&!e.target.closest('.node')){
      const anchor=uAt(e.clientX), span=(U1-U0)*0.5, k=(anchor-U0)/(U1-U0);
      setView(anchor-k*span,anchor-k*span+span);
      lastTap={t:0,x:0};
    } else lastTap={t:now,x:e.clientX};
  }
  ptrs.delete(e.pointerId);
  if(ptrs.size<2)pinch=null;
  if(ptrs.size===0)drag=null;
}
addEventListener('pointerup',ptrUp); addEventListener('pointercancel',ptrUp);

/* ---------- museum panel ---------- */
const museum=document.getElementById('museum'),veil=document.getElementById('veil');
function openMuseum(ev){
  document.getElementById('m-era').textContent=ev.era+(ev.flag?' · '+ev.flag:'');
  document.getElementById('m-title').textContent=ev.t;
  document.getElementById('m-date').textContent=ev.d;
  document.getElementById('m-body').innerHTML=
    (ev.flag?`<span class="chip">${ev.flag}</span>`:'')+
    `<p>${ev.s}</p>`+
    (ev.href?`<p><a href="${ev.href}">Enter the museum → full card</a></p>`:'');
  museum.classList.add('open');veil.classList.add('open');
  museum.setAttribute('aria-hidden','false');
}
function closeMuseum(){museum.classList.remove('open');veil.classList.remove('open');museum.setAttribute('aria-hidden','true');}
veil.onclick=closeMuseum;
document.querySelector('.m-close').onclick=closeMuseum;
addEventListener('keydown',e=>{if(e.key==='Escape')closeMuseum();});

addEventListener('resize',resize);
resize(); requestAnimationFrame(frame);
</script>
</body>
</html>
